[project]
license = "Apache-2.0"
name = "model-registry"
version = "0.1.0"
description = "Central catalog of model versions and routing table for Pi inference cluster"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.165.0",
    "uvicorn[standard]>=0.54.0",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "sqlalchemy[asyncio]>=2.1.8",
    "alembic>=1.20.1",
    "httpx>=0.28.0",
    "structlog>=24.4.0",
    "cachetools>=8.0.2",
    "opentelemetry-api>=1.45.1",
    "opentelemetry-sdk>=1.29.0",
    "opentelemetry-instrumentation-fastapi>=0.50b0",
    "opentelemetry-instrumentation-httpx>=0.50b0",
    "opentelemetry-exporter-otlp-proto-http>=1.29.0",
    "psycopg[binary,pool]>=3.3.9",
    "minio>=7.2.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "httpx>=0.28.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.17.6",
    "ty>=0.0.107",
    "detect-secrets>=1.5.0",
    "pytest-timeout>=2.3.1",
    "pytest-xdist>=3.6.0",
    "pip-audit>=2.10.0",
    "bandit[toml]>=1.9.4",
    "vulture>=2.11",
    # pip-audit -> pip-api -> pip: floor past PYSEC-2026-3721 (fixed in pip 26.2)
    "pip>=26.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.ty.environment]
python-version = "3.14"
python = ".venv"
extra-paths = ["src", "scripts"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=src --cov-report=term-missing"
timeout = 180
markers = [
    "integration: marks tests as integration tests",
    "slow: marks tests as slow-running",
    "e2e: marks tests as end-to-end tests requiring Docker",
]

[tool.coverage.run]
source = ["src"]
branch = true
concurrency = ["greenlet", "thread"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.isort]
profile = "black"
line_length = 100
src_paths = ["src"]
known_first_party = ["db", "models", "routers", "services", "config", "observability"]

[tool.bandit]
targets = ["src"]
skips = ["B101", "B108", "B110"]

[tool.vulture]
paths = ["src/", "vulture_whitelist.py"]
min_confidence = 100
ignore_names = ["dialect", "_method_name"]

[tool.coverage.report]
fail_under = 80

[tool.local-ci]
# Full DB-heavy suite (468 tests, DROP SCHEMA + create_all per test against
# remote postgres) takes ~13 min serially — exceeds the pre-push hook's 5-min
# budget. Tests run canonically in CI (python-service.yml archetype) with an
# ephemeral postgres sidecar local to the runner. Same pattern as licenses/.
skip_tests = true
